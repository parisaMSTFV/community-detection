[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-category-community-detection"
version = "1.1.0"
description = "Guarded user-category community detection with temporal and stability checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parisa Mostafavi" }]
dependencies = [
  "matplotlib>=3.9",
  "networkx==3.6.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[project.scripts]
community-detection = "community_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
community_detection = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=community_detection --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
